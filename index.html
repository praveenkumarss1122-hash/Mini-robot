<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Robot</title><style>body{background:#000;color:#fff;text-align:center;padding:20px;font-family:sans-serif}h1{font-size:70px}button{padding:12px 20px;margin:6px;border-radius:20px;border:0;background:#FF0066;color:#fff;font-size:16px}</style></head><body><h1>🤖</h1><h2>Mini Robot</h2><p id="t">Hi Parveen! Ready</p><button onclick="speak('Hello Parveen')">Hello</button><button onclick="start()">🎤 Matladu</button><button onclick="document.body.style.background='#000';speak('Screen off')">🌙 Screen Off</button><button onclick="document.body.style.background='#222';speak('Screen on')">☀️ On Chey</button><script>function speak(m){speechSynthesis.speak(new SpeechSynthesisUtterance(m));t.innerText=m}function start(){let r=new(window.SpeechRecognition||window.webkitSpeechRecognition)();r.lang='te-IN';r.start();t.innerText='Vintunna...';r.onresult=e=>{let c=e.results[0][0].transcript.toLowerCase();if(c.includes('screen off')){document.body.style.background='#000';speak('Screen off')}else if(c.includes('on chey')){document.body.style.background='#222';speak('Welcome back')}else if(c.includes('youtube')){open('https://m.youtube.com/results?search_query='+c.replace('youtube',''));speak('YouTube')}else speak(c)}}window.onload=()=>speak('Ready')</script></body></html>
